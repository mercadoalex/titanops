replicaCount: 1

image:
  repository: titanops/brainops
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  # Example for IRSA:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/brainops-role

cockroachdb:
  uri: ""  # Required — must be provided via secret
  poolSize: 10

nats:
  url: "nats://titanops-nats:4222"
  subject: "titanops.correlation.incidents.>"

bedrock:
  region: "us-east-2"
  modelId: "anthropic.claude-3-haiku-20240307"
  embeddingModelId: "amazon.titan-embed-text-v2:0"

safety:
  rateLimitPerMinute: 10
  circuitBreakerThreshold: 3
  circuitBreakerWindowMs: 300000

selfOptimization:
  enabled: true
  cron: "0 */6 * * *"
  queryLatencyThresholdMs: 100

managedMcp:
  endpoint: "https://cockroachlabs.cloud/mcp"
  apiKey: ""  # Required — must be provided via secret

ccloud:
  clusterId: ""
  serviceAccountKey: ""  # Sensitive — should be provided via secret

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

healthPort: 3001

logLevel: info
