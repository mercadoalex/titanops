apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brainops.fullname" . }}-secrets
  labels:
    {{- include "brainops.labels" . | nindent 4 }}
type: Opaque
stringData:
  cockroachdb-uri: {{ .Values.cockroachdb.uri | quote }}
  managed-mcp-api-key: {{ .Values.managedMcp.apiKey | quote }}
  ccloud-service-account-key: {{ .Values.ccloud.serviceAccountKey | quote }}
