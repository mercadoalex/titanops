name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: "**/go.sum"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout=5m
          working-directory: .

  build-and-test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: "**/go.sum"

      - name: Build all modules
        run: |
          for mod in $(grep '\./' go.work | tr -d '\t'); do
            echo "::group::Build $mod"
            (cd "$mod" && go build ./...)
            echo "::endgroup::"
          done

      - name: Vet all modules
        run: |
          for mod in $(grep '\./' go.work | tr -d '\t'); do
            echo "::group::Vet $mod"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done

      - name: Test all modules (with race detector)
        run: |
          for mod in $(grep '\./' go.work | tr -d '\t'); do
            echo "::group::Test $mod"
            (cd "$mod" && go test -race -timeout 120s -coverprofile=coverage.out ./...)
            echo "::endgroup::"
          done

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
